const tip=document.getElementById("sbtip");
function showTip(html,ev){ tip.innerHTML=html; tip.classList.add("on");
  const fig=svg.closest(".sb-figure").getBoundingClientRect();
  let x=ev.clientX-fig.left+14, y=ev.clientY-fig.top+14;
  x=Math.min(x, fig.width-tip.offsetWidth-8); tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.classList.remove("on"); }

let a = START;
DATA.forEach((d,ti)=>{
  const sweep = d.count/TOTAL*TAU, a0=a, a1=a+sweep; a=a1;
  const base=cssv(COL[ti][0]), tint=cssv(COL[ti][1]);
  // inner topic arc
  const inner=mk("path",{d:sector(HOLE,R1,a0,a1),fill:base,class:"arc",stroke:cssv("--panel"),"stroke-width":"2"});
  inner.addEventListener("mousemove",e=>{svg.classList.add("dim");inner.classList.add("hot");
    showTip(`<span class="k">${d.count} papers</span><br><b>${d.topic}</b>`,e);});
  inner.addEventListener("mouseleave",()=>{svg.classList.remove("dim");inner.classList.remove("hot");hideTip();});
  svg.appendChild(inner);
  // count INSIDE the inner segment; textual label OUTSIDE (below)
  const mid=(a0+a1)/2;
  const [icx,icy]=pol((HOLE+R1)/2,mid);
  const itot=mk("text",{x:icx,y:icy+5,"text-anchor":"middle",class:"sb-cnt","font-size":"14",
    stroke:base,"stroke-width":"2.5"}); itot.textContent=d.count; svg.appendChild(itot);
  const [ax,ay]=pol(R2+4,mid), [bx,by]=pol(R2+20,mid);
  const right = Math.cos(mid) >= 0;
  const tx = bx + (right ? 8 : -8);
  const lead = base;
  svg.appendChild(mk("line",{x1:ax,y1:ay,x2:bx,y2:by,stroke:lead,"stroke-width":"1.2","opacity":"0.55"}));
  svg.appendChild(mk("line",{x1:bx,y1:by,x2:tx,y2:by,stroke:lead,"stroke-width":"1.2","opacity":"0.55"}));
  const lbl=mk("text",{x:tx+(right?3:-3),y:by+4,"text-anchor":right?"start":"end",
    "font-size":"13","font-weight":"600","fill":base});
  lbl.textContent=d.short; svg.appendChild(lbl);        // name only outside; number is inside
  // outer paper arcs
  const n=d.papers.length||1;
  d.papers.forEach((p,pi)=>{
    const b0=a0+(pi/n)*sweep, b1=a0+((pi+1)/n)*sweep;
    const path=mk("path",{d:sector(R1+2,R2,b0,b1),fill:tint,class:"arc outer",stroke:cssv("--panel"),"stroke-width":"0.6"});
    path.addEventListener("mousemove",e=>{svg.classList.add("dim");path.classList.add("hot");
      const head=p.ve?`<b>${p.ve}</b>`:`<span class="k">${d.topic}</span>`;
      showTip(`${head}<br>${p.t}`,e);});
    path.addEventListener("mouseleave",()=>{svg.classList.remove("dim");path.classList.remove("hot");hideTip();});
    if(p.u) path.addEventListener("click",()=>window.open(p.u,"_blank","noopener"));
    svg.appendChild(path);
  });
});
// center
svg.appendChild(mk("circle",{cx:CX,cy:CY,r:HOLE-2,fill:cssv("--hole")}));
const cn=mk("text",{x:CX,y:CY-2,"text-anchor":"middle",class:"sb-center-n","font-size":"40"}); cn.textContent=TOTAL;
const cl=mk("text",{x:CX,y:CY+20,"text-anchor":"middle",class:"sb-center-l"}); cl.textContent="publications";
svg.appendChild(cn); svg.appendChild(cl);
// legend
const leg=document.getElementById("sblegend");
DATA.forEach((d,ti)=>{ const el=document.createElement("div"); el.className="sb-leg";
  el.innerHTML=`<span class="sw" style="background:${cssv(COL[ti][0])}"></span><span class="nm">${d.topic}</span><span class="ct">${d.count}</span>`;
  leg.appendChild(el); });
</script>

</body>
